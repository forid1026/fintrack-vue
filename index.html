<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FinTrack | Income &amp; Expense Tracker</title>
  <meta name="description" content="FinTrack is a simple and modern personal income and expense tracker. Track balance, monthly summaries and spending insights. Your data stays in your browser.">

  <meta name="theme-color" content="#0b1120">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Absolute-URL tags: filled from VITE_SITE_URL at build time, removed when it is not set. -->
  <link rel="canonical" href="__SITE_URL__/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FinTrack">
  <meta property="og:title" content="FinTrack | Income &amp; Expense Tracker">
  <meta property="og:description" content="Track income, expenses, balance, monthly summaries and spending insights with FinTrack.">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FinTrack | Income &amp; Expense Tracker">
  <meta name="twitter:description" content="A simple and modern personal income and expense tracker.">
  <meta name="twitter:image" content="__SITE_URL__/og-image.png">
</head>

<body>
  <div id="app"></div>

  <noscript>
    <p style="font-family: sans-serif; color: #e2e8f0; padding: 24px;">
      FinTrack needs JavaScript to run. Please enable JavaScript in your browser.
    </p>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
